name: Build and release PC Cleaner

# Builds the Windows .exe with PyInstaller (per PCCleaner.spec) and packages
# it into a one-click installer with Inno Setup (per installer.iss).
#
# - Push a tag like "v1.0.1" to publish a GitHub Release with both the
#   installer (PCCleaner-Setup.exe) and a zip of the raw app folder attached
#   as downloadable assets.
# - You can also run this manually from the Actions tab (workflow_dispatch)
#   to sanity-check the build without publishing a release.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build executable with PyInstaller
        run: pyinstaller PCCleaner.spec

      - name: Zip the app folder
        run: Compress-Archive -Path dist\PCCleaner\* -DestinationPath PCCleaner-portable.zip

      - name: Build installer with Inno Setup
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss

      - name: Upload build artifacts (always, for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: PCCleaner-build
          path: |
            PCCleaner-portable.zip
            installer_output\PCCleaner-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PCCleaner-portable.zip
            installer_output\PCCleaner-Setup.exe
          generate_release_notes: true
